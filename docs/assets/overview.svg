<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 550" width="600" height="550" role="img" aria-labelledby="title" font-family="Schibsted Grotesk, Arial, sans-serif"><title id="title">HEFS: dominant features predict; complementary features refine through multiplicative correction.</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#606879"/></marker></defs><text x="30" y="30" font-size="13" fill="#606879" font-weight="600" text-anchor="start">A FORECAST, THEN A REFINEMENT</text><rect x="30" y="58" width="235" height="66" rx="9" fill="#eef1fc" stroke="#a3b3ee"/><text x="48" y="85" font-size="18" fill="#3355d6" font-weight="600" text-anchor="start">Dominant features</text><text x="48" y="108" font-size="13" fill="#606879" font-weight="400" text-anchor="start">Strong initial predictors</text><rect x="330" y="58" width="240" height="66" rx="9" fill="#eef7f4" stroke="#a5cfc4"/><text x="348" y="85" font-size="17" fill="#17816c" font-weight="600" text-anchor="start">Complementary features</text><text x="348" y="108" font-size="13" fill="#606879" font-weight="400" text-anchor="start">Additional context</text><path d="M147,124 L147,172" stroke="#606879" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/><path d="M450,124 L450,302" stroke="#606879" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/><rect x="30" y="174" width="235" height="70" rx="9" fill="#fff" stroke="#3355d6"/><text x="48" y="201" font-size="13" fill="#3355d6" font-weight="600" text-anchor="start">Layer 1</text><text x="48" y="226" font-size="19" fill="#1c2230" font-weight="600" text-anchor="start">Predict the target</text><path d="M147,244 L147,285" stroke="#606879" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/><text x="147" y="309" font-size="16" fill="#1c2230" font-weight="500" text-anchor="middle">Initial prediction</text><path d="M220,303 L328,336" stroke="#606879" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/><rect x="330" y="304" width="240" height="78" rx="9" fill="#fff" stroke="#17816c"/><text x="348" y="331" font-size="13" fill="#17816c" font-weight="600" text-anchor="start">Layer 2</text><text x="348" y="358" font-size="18" fill="#1c2230" font-weight="600" text-anchor="start">Predict the correction</text><path d="M147,325 L147,432" stroke="#606879" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/><path d="M450,382 L450,432" stroke="#606879" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/><rect x="30" y="434" width="540" height="76" rx="9" fill="#eef1fc" stroke="#3355d6"/><text x="300" y="464" font-size="18" fill="#3355d6" font-weight="600" text-anchor="middle">Refined prediction</text><text x="300" y="489" font-size="17" fill="#1c2230" font-weight="400" text-anchor="middle">initial prediction × (1 + correction)</text><text x="300" y="540" font-size="13" fill="#606879" font-weight="400" text-anchor="middle">The second layer learns correction targets during training.</text></svg>
