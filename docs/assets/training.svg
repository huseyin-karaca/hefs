<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 450" width="480" height="450" role="img" aria-labelledby="title" font-family="Schibsted Grotesk, Arial, sans-serif"><title id="title">Training constructs correction targets from observed training data, then fits the second model.</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#606879"/></marker></defs><text x="24" y="28" font-size="13" fill="#3355d6" font-weight="600" text-anchor="start">TRAINING</text><rect x="24" y="48" width="432" height="62" rx="9" fill="#eef1fc" stroke="#a3b3ee"/><text x="240" y="74" font-size="17" fill="#1c2230" font-weight="600" text-anchor="middle">Dominant features → first model</text><text x="240" y="97" font-size="14" fill="#606879" font-weight="400" text-anchor="middle">Produce the initial prediction</text><path d="M240,110 L240,151" stroke="#606879" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/><rect x="24" y="153" width="432" height="92" rx="9" fill="#fff" stroke="#3355d6"/><text x="240" y="180" font-size="18" fill="#3355d6" font-weight="600" text-anchor="middle">Cost-optimization search</text><text x="240" y="206" font-size="14" fill="#1c2230" font-weight="400" text-anchor="middle">Observed training targets + initial predictions</text><text x="240" y="230" font-size="14" fill="#606879" font-weight="400" text-anchor="middle">Find corrections with low absolute error</text><path d="M240,245 L240,292" stroke="#606879" stroke-width="1.6" fill="none" marker-end="url(#arrow)" stroke-dasharray="5 5"/><rect x="24" y="294" width="432" height="104" rx="9" fill="#eef7f4" stroke="#a5cfc4"/><text x="240" y="323" font-size="18" fill="#17816c" font-weight="600" text-anchor="middle">Fit the correction model</text><text x="240" y="350" font-size="14" fill="#1c2230" font-weight="400" text-anchor="middle">Inputs: complementary features + first prediction</text><text x="240" y="376" font-size="14" fill="#606879" font-weight="400" text-anchor="middle">Supervision: correction targets from the search</text><text x="240" y="430" font-size="14" fill="#606879" font-weight="400" text-anchor="middle">Save both models and any fitted scalers.</text></svg>
