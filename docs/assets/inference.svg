<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 416" width="480" height="416" role="img" aria-labelledby="title" font-family="Schibsted Grotesk, Arial, sans-serif"><title id="title">Inference uses two learned models and multiplies the initial prediction by one plus the correction.</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#606879"/></marker></defs><text x="24" y="28" font-size="13" fill="#3355d6" font-weight="600" text-anchor="start">INFERENCE</text><rect x="24" y="48" width="432" height="62" rx="9" fill="#eef1fc" stroke="#a3b3ee"/><text x="240" y="74" font-size="17" fill="#1c2230" font-weight="600" text-anchor="middle">Dominant features → first model</text><text x="240" y="97" font-size="14" fill="#606879" font-weight="400" text-anchor="middle">Produce the initial prediction</text><path d="M240,110 L240,151" stroke="#606879" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/><rect x="24" y="153" width="432" height="85" rx="9" fill="#eef7f4" stroke="#a5cfc4"/><text x="240" y="181" font-size="16" fill="#1c2230" font-weight="600" text-anchor="middle">Complementary features + first prediction</text><text x="240" y="210" font-size="16" fill="#17816c" font-weight="500" text-anchor="middle">Second model → predicted correction</text><path d="M240,238 L240,281" stroke="#606879" stroke-width="1.6" fill="none" marker-end="url(#arrow)"/><rect x="24" y="283" width="432" height="78" rx="9" fill="#eef1fc" stroke="#3355d6"/><text x="240" y="312" font-size="18" fill="#3355d6" font-weight="600" text-anchor="middle">Multiply to refine</text><text x="240" y="338" font-size="15" fill="#1c2230" font-weight="400" text-anchor="middle">first prediction × (1 + predicted correction)</text><text x="240" y="394" font-size="14" fill="#606879" font-weight="400" text-anchor="middle">No observed target. No correction search.</text></svg>
