name: Validate the example and the project page
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python examples/quickstart.py
      # docs/ is a single static page; the main site's `Deploy site` workflow copies it
      # to hkaraca.com/hefs/. There is nothing to build here, only the page's own check.
      - run: python tools/check_site.py
      - uses: actions/upload-artifact@v4
        with:
          name: hefs-project-page
          path: docs/
